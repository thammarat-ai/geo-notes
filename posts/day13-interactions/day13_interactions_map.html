const COL = {DQ:'#2dd4bf', DL:'#f97316', BQ:'#1e3a5f', BL:'#f4566a'};
const LAB = {DQ:'มืด + เงียบ', DL:'มืด แต่มีเสียง', BQ:'สว่าง + เงียบ', BL:'สว่าง + มีเสียง'};
const map = L.map('map',{zoomSnap:.5}).setView([13.2,100.9],6);
// ไม่ใช้ tile ภายนอก (CARTO ต้องมี API key แล้ว) — วาดขอบประเทศไทยเองจาก Natural Earth
L.geoJSON({type:'Feature', geometry: DATA.outline},
  {style: {color:'#3b4a63', weight:1.1, fillColor:'#111a2b', fillOpacity:1, opacity:1}}).addTo(map);
document.getElementById('holder').innerHTML = '<option value="">ทุกกลุ่ม</option>' +
  DATA.holders.map(h=>`<option value="${h}">${h}</option>`).join('');
let layer, fitted = false;
function quad(p, dk, qt){
  const isD = p.d <= dk, isQ = p.n >= qt;
  return isD && isQ ? 'DQ' : isD && !isQ ? 'DL' : !isD && isQ ? 'BQ' : 'BL';
}
function draw(){
  const dk = +document.getElementById('dark').value;
  const qt = +document.getElementById('quiet').value;
  const hf = document.getElementById('holder').value;
  document.getElementById('dv').textContent = dk;
  document.getElementById('qv').textContent = qt;
  if (layer) map.removeLayer(layer);
  const cnt = {DQ:0, DL:0, BQ:0, BL:0};
  const gj = {type:'FeatureCollection', features: DATA.hex.map((f,i)=>{
    const p = DATA.props[i], k = quad(p, dk, qt);
    if (!hf || p.h === hf) cnt[k]++;                       // ตัวเลขนับตามตัวกรองจริง
    return {type:'Feature', geometry:f.geometry, properties:{...p, k, dim: !!hf && p.h !== hf}};
  })};
  layer = L.geoJSON(gj, {
    style: f => { const p = (f && f.properties) || {};
                 return {color:'transparent', weight:0, fillOpacity: p.dim ? 0.08 : 0.78,
                         fillColor: COL[p.k] || '#334155'}; },
    onEachFeature: (f, l) => l.bindPopup(
      `<b>${f.properties.s}</b><br>ผู้ถือครอง: ${f.properties.h}<br>` +
      `ไกลจากจุดทะเบียน ${f.properties.d} กม. · ไกลจากแหล่งเสียง ${f.properties.n} กม.<br>` +
      `ประชากรเมืองใน 30 กม.: ${f.properties.u.toLocaleString()} คน<br>` +
      `กลุ่มนี้: <b style="color:${COL[f.properties.k]}">${LAB[f.properties.k]}</b><br>` +
      `<span style="color:#64748b">${f.properties.r} · แหล่งเสียงใกล้สุด: ${f.properties.ns}</span>`)
  }).addTo(map);
  const total = Object.values(cnt).reduce((a,b)=>a+b,0);
  document.getElementById('panel').innerHTML =
    `<b>เกณฑ์ปัจจุบัน</b><div class="hint">มืด ≤ ${dk} กม. · เงียบ ≥ ${qt} กม.` +
    (hf ? ` · นับเฉพาะผู้ถือครอง “${hf}”` : '') + `</div>` +
    Object.keys(LAB).map(k=>`<div><span class="sw" style="background:${COL[k]}"></span>${LAB[k]}` +
      `<span class="num">${cnt[k]} เซลล์</span></div>`).join('') +
    `<div class="hint">รวม ${total} เซลล์ · สัดส่วนมืด+เงียบ = ` +
    (total ? (cnt.DQ/total*100).toFixed(1) : '0.0') + `%` +
    (hf ? '' : ` · hex มืด+เงียบบนที่ดินเอกชน ` +
      DATA.props.filter((p,i)=> quad(p,dk,qt)==='DQ' && p.h==='ที่ดินส่วนบุคคล').length + ` เซลล์`) +
    `</div>`;
}
['dark','quiet','holder'].forEach(id => document.getElementById(id)
  .addEventListener('input', draw));
draw();
if (!fitted && layer) { map.fitBounds(layer.getBounds(), {padding:[14,14]}); fitted = true; }
</script></body></html>
